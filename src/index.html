<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockade Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Blockade Game</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="hud">
        <span id="score" class="stat">Score: 0</span>
        <span id="level" class="stat">Level: 1</span>
        <span id="power" class="stat">Destroy: 0</span>
    </div>

    <div id="controls">
        <button id="startButton" class="button">New Game</button>
        <button id="continueButton" class="button" style="display:none">Continue</button>
    </div>

    <div id="legend">
        <span class="legend-item"><span class="dot player"></span> You</span>
        <span class="legend-item"><span class="dot obstacle"></span> Grey — avoid</span>
        <span class="legend-item"><span class="dot green"></span> Green +10</span>
        <span class="legend-item"><span class="dot blue"></span> Blue +50</span>
        <span class="legend-item"><span class="dot yellow"></span> Yellow — destroy 2–3 greys</span>
    </div>

    <div id="settings">
        <h2>Settings <span class="hint">(auto-saved · apply on New Game)</span></h2>
        <label>Mute sounds
            <input type="checkbox" id="mute">
        </label>
        <label>Change background color each level
            <input type="checkbox" id="colorChange" checked>
        </label>
        <label>Score between waves
            <input type="number" id="scorePerWave" value="300" min="50" step="50">
        </label>
        <label>Grey blocks per wave
            <input type="number" id="greysPerWave" value="5" min="1" max="100">
        </label>
        <label>Total levels
            <input type="number" id="maxLevels" value="10" min="1" max="50">
        </label>
        <label>Green blocks on screen
            <input type="number" id="maxGreens" value="3" min="1" max="20">
        </label>
        <label>Blue bonus frequency (seconds)
            <input type="number" id="bonusInterval" value="8" min="2" max="120">
        </label>
        <label>Yellow: levels between spawns
            <input type="number" id="yellowLevelGap" value="5" min="1" max="50">
        </label>
        <label>Yellow: max destroy charges
            <input type="number" id="maxPowerForYellow" value="10" min="0" max="100">
        </label>
    </div>

    <script src="app.js"></script>
</body>
</html>
